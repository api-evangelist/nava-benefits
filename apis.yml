description: 'Nava Benefits is a modern employee benefits brokerage that pairs expert human
  advisors with AI-driven technology to help HR teams manage health insurance renewals, audit
  billing, control benefits costs, and improve the employee experience. Its platform includes
  "HQ for HR" for benefits administration, renewals, and document management, and "HQ for
  Employees" for 24/7 benefits support, plan-decision tools, provider search, and digital ID
  cards, backed by consultants advising on self-funding and captive strategies. Surfaced as a
  gv portfolio company and added to the API Evangelist network; this enrichment pass found no
  public API, developer portal, or developer documentation surface.'
